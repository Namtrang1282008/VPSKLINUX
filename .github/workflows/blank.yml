name: VPS-LINUX-GIGABIT-FIXED
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Kiem tra Secret (Tranh loi hien Link)
        run: |
          if [ -z "${{ secrets.TAILSCALE_AUTHKEY }}" ]; then
            echo "LOI: Ban chua thiet lap TAILSCALE_AUTHKEY trong Settings/Secrets!"
            exit 1
          fi

      - name: 2. Cai dat va Tu dong Login
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          # Ep buoc dung Key de khong bao gio hien Link bat xac thuc
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-dns=false

      - name: 3. Thiet lap SSH (Thong tin dang nhap o day)
        run: |
          sudo apt update && sudo apt install -y openssh-server
          # Mat khau: vps123456
          echo "runner:vps123456" | sudo chpasswd
          sudo service ssh start
          echo "------------------------------------------"
          echo "DANG NHAP THANH CONG!"
          echo "User: runner"
          echo "Pass: vps123456"
          echo "Port: 22"
          echo "IP: Xem trong app Tailscale tren dien thoai"
          echo "------------------------------------------"

      - name: 4. Treo may 6 tieng
        run: sleep 21600
